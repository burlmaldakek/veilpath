name: Build Veilpath IPA
on: workflow_dispatch:
jobs: build: runs-on: xcode-27
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Show Xcode version
    run: |
      xcodebuild -version
      xcode-select -p

  - name: Build Veilpath
    run: |
      xcodebuild \
        -project Veilpath.xcodeproj \
        -scheme Veilpath \
        -sdk iphoneos \
        -configuration Release \
        -destination 'generic/platform=iOS' \
        -derivedDataPath build \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO \
        build

  - name: Package IPA
    run: |
      mkdir -p Payload
      cp -R build/Build/Products/Release-iphoneos/Veilpath.app Payload/
      zip -r Veilpath.ipa Payload

  - name: Upload IPA
    uses: actions/upload-artifact@v4
    with:
      name: Veilpath-IPA
      path: Veilpath.ipa
